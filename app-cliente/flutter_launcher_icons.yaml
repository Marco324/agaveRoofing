# Íconos de la app generados a partir del logo de Agave Roofing.
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/icono_app.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icono_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icono_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/branding/icono_app.png"
  windows:
    generate: true
    image_path: "assets/branding/icono_app.png"
    icon_size: 256
